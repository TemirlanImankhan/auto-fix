<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройка AutoFix</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background: #0b1110; color: #f1f5eb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; }
      main { width: min(100%, 470px); border: 1px solid #2b3934; border-radius: 22px; background: #111a18; padding: 32px; }
      .mark { color: #c6f36b; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 16px 0 8px; font-size: 30px; letter-spacing: -.04em; }
      p { color: #9baaa2; font-size: 14px; line-height: 1.65; }
      label { display: block; margin-top: 24px; color: #c2cec7; font-size: 13px; font-weight: 600; }
      input { width: 100%; min-height: 48px; margin-top: 8px; border: 1px solid #2b3934; border-radius: 10px; background: #0b1110; color: #f1f5eb; padding: 0 13px; font-size: 14px; }
      button { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 10px; background: #c6f36b; color: #11180d; font-size: 14px; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .65; cursor: wait; }
      [role="alert"] { min-height: 22px; color: #ff806e; }
      :focus-visible { outline: 2px solid #c6f36b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">AutoFix · Windows</div>
      <h1>Подключим вашу веб-версию</h1>
      <p>Введите HTTPS-адрес опубликованного AutoFix. Приложение откроет тот же гараж и историю; USB-адаптер ELM327 можно подключить на странице диагностики.</p>
      <form id="site-form">
        <label for="site-url">Адрес AutoFix</label>
        <input id="site-url" name="site-url" type="url" autocomplete="url" placeholder="https://autofix.example.com" required>
        <p id="error" role="alert" aria-live="polite"></p>
        <button id="submit" type="submit">Открыть AutoFix</button>
      </form>
    </main>
    <script>
      const form = document.querySelector("#site-form");
      const input = document.querySelector("#site-url");
      const error = document.querySelector("#error");
      const submit = document.querySelector("#submit");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        submit.disabled = true;
        try {
          await window.autoFixDesktop.saveSiteUrl(input.value);
        } catch (cause) {
          error.textContent = cause instanceof Error ? cause.message : "Не удалось сохранить адрес.";
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
